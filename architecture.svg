<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a4c"/>
      <stop offset="1" stop-color="#e0662a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8592a3"/>
    </marker>
  </defs>

  <rect width="900" height="460" rx="16" fill="#0a0e14"/>
  <text x="450" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="url(#accent)" letter-spacing="1.5">SYSTEM ARCHITECTURE</text>

  <!-- Clients -->
  <rect x="40" y="80" width="230" height="86" rx="12" fill="#131a24" stroke="#26313f"/>
  <text x="155" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#eef2f6">Mobile App</text>
  <text x="155" y="140" text-anchor="middle" font-size="12" fill="#8592a3">manual · voice · autonomous</text>

  <rect x="40" y="200" width="230" height="86" rx="12" fill="#131a24" stroke="#26313f"/>
  <text x="155" y="236" text-anchor="middle" font-size="16" font-weight="600" fill="#eef2f6">Web Dashboard</text>
  <text x="155" y="260" text-anchor="middle" font-size="12" fill="#8592a3">Flask + JS · charts · map</text>

  <!-- WiFi / WebSocket link -->
  <path d="M270 123 L350 190" stroke="#8592a3" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <path d="M270 243 L350 215" stroke="#8592a3" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <rect x="268" y="296" width="120" height="44" rx="10" fill="#0e131b" stroke="#e0662a" stroke-dasharray="5 4"/>
  <text x="328" y="316" text-anchor="middle" font-size="12" font-weight="600" fill="#ff8a4c">WebSocket · JSON</text>
  <text x="328" y="332" text-anchor="middle" font-size="11" fill="#8592a3">ws://192.168.4.1/ws</text>

  <!-- ESP32 -->
  <rect x="360" y="150" width="190" height="130" rx="14" fill="#131a24" stroke="#e0662a" stroke-width="2"/>
  <text x="455" y="188" text-anchor="middle" font-size="18" font-weight="700" fill="#eef2f6">ESP32</text>
  <text x="455" y="212" text-anchor="middle" font-size="12" fill="#8592a3">Firmware (Arduino C++)</text>
  <text x="455" y="232" text-anchor="middle" font-size="12" fill="#8592a3">WiFi Access Point</text>
  <text x="455" y="252" text-anchor="middle" font-size="12" fill="#8592a3">"MarsRover-AP"</text>

  <!-- Outputs / Sensors -->
  <path d="M550 190 L620 120" stroke="#8592a3" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M550 215 L620 215" stroke="#8592a3" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <path d="M550 240 L620 310" stroke="#8592a3" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <rect x="620" y="70" width="240" height="100" rx="12" fill="#131a24" stroke="#26313f"/>
  <text x="740" y="100" text-anchor="middle" font-size="15" font-weight="600" fill="#eef2f6">Drive System</text>
  <text x="740" y="122" text-anchor="middle" font-size="12" fill="#8592a3">2× BTS7960 → 6 DC gear motors</text>
  <text x="740" y="142" text-anchor="middle" font-size="12" fill="#8592a3">Quadrature encoders (RPM)</text>

  <rect x="620" y="180" width="240" height="70" rx="12" fill="#131a24" stroke="#26313f"/>
  <text x="740" y="208" text-anchor="middle" font-size="15" font-weight="600" fill="#eef2f6">Navigation Sensors</text>
  <text x="740" y="230" text-anchor="middle" font-size="12" fill="#8592a3">VL53L0X ToF + servo · NEO-6M GPS</text>

  <rect x="620" y="260" width="240" height="100" rx="12" fill="#131a24" stroke="#26313f"/>
  <text x="740" y="290" text-anchor="middle" font-size="15" font-weight="600" fill="#eef2f6">Environment &amp; Alerts</text>
  <text x="740" y="312" text-anchor="middle" font-size="12" fill="#8592a3">DHT11 · MQ-5 gas sensor</text>
  <text x="740" y="332" text-anchor="middle" font-size="12" fill="#8592a3">Proximity buzzer</text>

  <!-- Footer legend -->
  <text x="450" y="420" text-anchor="middle" font-size="12" fill="#8592a3">Telemetry streams ESP32 → clients ~3×/second · commands flow clients → ESP32 instantly</text>
</svg>
